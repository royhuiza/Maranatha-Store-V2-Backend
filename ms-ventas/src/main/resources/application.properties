spring.application.name=MS-VENTAS
server.port=${SERVER_PORT:8084}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_ventas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_null
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
services.producto.url=${PRODUCTO_SERVICE_URL:http://localhost:8082}
services.cliente.url=${CLIENTE_SERVICE_URL:http://localhost:8083}
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
