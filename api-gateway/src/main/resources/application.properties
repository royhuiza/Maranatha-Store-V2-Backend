# URLs directas a cada servicio
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.producto.url=${PRODUCTO_SERVICE_URL:http://localhost:8082}
services.cliente.url=${CLIENTE_SERVICE_URL:http://localhost:8083}
services.ventas.url=${VENTAS_SERVICE_URL:http://localhost:8084}
services.chat.url=${CHAT_SERVICE_URL:http://localhost:8087}
services.facturacion.url=${FACTURACION_SERVICE_URL:http://localhost:8085}

# Security - JWT_SECRET obligatorio
jwt.secret=${JWT_SECRET:?Configura JWT_SECRET antes de iniciar}

spring.cloud.gateway.routes[0].id=ms-auth
spring.cloud.gateway.routes[0].uri=${services.auth.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/auth/?(?<segment>.*), /auth/$\{segment}

spring.cloud.gateway.routes[1].id=ms-auth-recovery
spring.cloud.gateway.routes[1].uri=${services.auth.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/recovery/**

spring.cloud.gateway.routes[2].id=ms-auth-users
spring.cloud.gateway.routes[2].uri=${services.auth.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[3].id=ms-auth-sessions
spring.cloud.gateway.routes[3].uri=${services.auth.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/sessions/**

spring.cloud.gateway.routes[4].id=ms-producto
spring.cloud.gateway.routes[4].uri=${services.producto.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.routes[5].id=ms-cliente
spring.cloud.gateway.routes[5].uri=${services.cliente.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/clientes/**

spring.cloud.gateway.routes[6].id=ms-cliente-doc
spring.cloud.gateway.routes[6].uri=${services.cliente.url}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/documento/**

spring.cloud.gateway.routes[7].id=ms-ventas
spring.cloud.gateway.routes[7].uri=${services.ventas.url}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/ventas/**

spring.cloud.gateway.routes[8].id=ms-chat
spring.cloud.gateway.routes[8].uri=${services.chat.url}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/chat/**

spring.cloud.gateway.routes[9].id=ms-facturacion
spring.cloud.gateway.routes[9].uri=${services.facturacion.url}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/facturacion/**

# Swagger UI - Documentacion agregada de todos los microservicios
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=ms-auth
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=ms-producto
springdoc.swagger-ui.urls[1].url=/api/productos/v3/api-docs
springdoc.swagger-ui.urls[2].name=ms-cliente
springdoc.swagger-ui.urls[2].url=/api/clientes/v3/api-docs
springdoc.swagger-ui.urls[3].name=ms-ventas
springdoc.swagger-ui.urls[3].url=/api/ventas/v3/api-docs
springdoc.swagger-ui.urls[4].name=ms-chat
springdoc.swagger-ui.urls[4].url=/api/v1/chat
springdoc.swagger-ui.urls[5].name=ms-facturacion
springdoc.swagger-ui.urls[5].url=/api/facturacion/v3/api-docs

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,gateway
