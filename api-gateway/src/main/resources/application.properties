spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.main.web-application-type=reactive

# URLs directas: funcionan al ejecutar cada servicio desde IntelliJ.
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.producto.url=${PRODUCTO_SERVICE_URL:http://localhost:8082}
services.cliente.url=${CLIENTE_SERVICE_URL:http://localhost:8083}
services.ventas.url=${VENTAS_SERVICE_URL:http://localhost:8084}

spring.cloud.gateway.routes[0].id=ms-auth
spring.cloud.gateway.routes[0].uri=${services.auth.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=ms-producto
spring.cloud.gateway.routes[1].uri=${services.producto.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/productos/**

spring.cloud.gateway.routes[2].id=ms-cliente
spring.cloud.gateway.routes[2].uri=${services.cliente.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/clientes/**

spring.cloud.gateway.routes[3].id=ms-ventas
spring.cloud.gateway.routes[3].uri=${services.ventas.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/ventas/**

# OpenAPI agregado en http://localhost:8080/swagger-ui.html
spring.cloud.gateway.routes[4].id=docs-auth
spring.cloud.gateway.routes[4].uri=${services.auth.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/docs/auth
spring.cloud.gateway.routes[4].filters[0]=SetPath=/api-docs
spring.cloud.gateway.routes[5].id=docs-productos
spring.cloud.gateway.routes[5].uri=${services.producto.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/docs/productos
spring.cloud.gateway.routes[5].filters[0]=SetPath=/api-docs
spring.cloud.gateway.routes[6].id=docs-clientes
spring.cloud.gateway.routes[6].uri=${services.cliente.url}
spring.cloud.gateway.routes[6].predicates[0]=Path=/docs/clientes
spring.cloud.gateway.routes[6].filters[0]=SetPath=/api-docs
spring.cloud.gateway.routes[7].id=docs-ventas
spring.cloud.gateway.routes[7].uri=${services.ventas.url}
spring.cloud.gateway.routes[7].predicates[0]=Path=/docs/ventas
spring.cloud.gateway.routes[7].filters[0]=SetPath=/api-docs

springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Autenticacion
springdoc.swagger-ui.urls[0].url=/docs/auth
springdoc.swagger-ui.urls[1].name=Productos
springdoc.swagger-ui.urls[1].url=/docs/productos
springdoc.swagger-ui.urls[2].name=Clientes
springdoc.swagger-ui.urls[2].url=/docs/clientes
springdoc.swagger-ui.urls[3].name=Ventas
springdoc.swagger-ui.urls[3].url=/docs/ventas

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=http://localhost:4200,http://127.0.0.1:4200,http://localhost
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

jwt.secret=${JWT_SECRET:MaranathaStoreClaveSuperSeguraJWT2026Maranatha}

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
logging.level.org.springframework.cloud.gateway=INFO

# Microservicio de facturacion
services.facturacion.url=${FACTURACION_SERVICE_URL:http://localhost:8085}

# Ruta de facturacion
spring.cloud.gateway.routes[8].id=ms-facturacion
spring.cloud.gateway.routes[8].uri=${services.facturacion.url}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/facturacion/**