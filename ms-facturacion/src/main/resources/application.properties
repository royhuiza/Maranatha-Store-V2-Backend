
# Nombre del microservicio
spring.application.name=ms-facturacion

# Puerto del microservicio
server.port=8085

# Desactivar Eureka temporalmente
eureka.client.enabled=false

# Entorno de facturacion
facturacion.sunat.ambiente=BETA

# Consulta de datos del contribuyente por RUC
consulta-ruc.enabled=${CONSULTA_RUC_ENABLED:false}

# URL interna del microservicio de clientes
consulta-ruc.cliente-url=${MS_CLIENTE_URL:http://ms-cliente:8083}

# Configuracion anterior conservada por compatibilidad
consulta-ruc.base-url=${CONSULTA_RUC_BASE_URL:}
consulta-ruc.api-token=${CONSULTA_RUC_API_TOKEN:}
consulta-ruc.connect-timeout-seconds=5
consulta-ruc.read-timeout-seconds=10

# Clave JWT compartida con ms-auth y api-gateway
jwt.secret=${JWT_SECRET}
