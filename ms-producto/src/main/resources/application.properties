spring.application.name=MS-PRODUCTO
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_producto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
services.ventas.url=${VENTAS_SERVICE_URL:http://localhost:8084}
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.accept-float-as-int=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

jwt.secret=${JWT_SECRET:MaranathaStoreClaveSuperSeguraJWT2026Maranatha}
services.internal-token=${INTERNAL_SERVICE_TOKEN:}
