spring.application.name=ms-chat
server.port=${SERVER_PORT:8087}
services.n8n.url=${N8N_URL:http://maranatha-n8n:5678/webhook/maranatha-chat}
services.producto.url=${PRODUCTO_SERVICE_URL:http://localhost:8082}
services.whatsapp.url=${WHATSAPP_URL:http://maranatha-whatsapp:8080/message/sendText/maranatha-store}
services.evolution-api.url=${EVOLUTION_API_URL:http://maranatha-whatsapp:8080}
integrations.evolution-api.api-key=${EVOLUTION_API_KEY:maranatha_secret_key_2026}
integrations.evolution-api.instance=${EVOLUTION_API_INSTANCE:maranatha-store}
spring.main.web-application-type=servlet
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
