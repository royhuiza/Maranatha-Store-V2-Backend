spring.application.name=ms-chat
server.port=${SERVER_PORT:8085}
services.n8n.url=${N8N_URL:http://maranatha-n8n:5678/webhook/maranatha-chat}
services.whatsapp.url=${WHATSAPP_URL:http://host.docker.internal:8081/message/sendText/maranatha}
services.evolution-api.url=${EVOLUTION_API_URL:http://maranatha-whatsapp:8080}
spring.main.web-application-type=servlet
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
