server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/clientedb
    username: cliente_user
    password: cliente_pass123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true