spring.application.name=MS-AUTH
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_null
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
jwt.secret=${JWT_SECRET:MaranathaStoreClaveSuperSeguraJWT2026Maranatha}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# SMTP: configure spring.mail.host/port/username/password via SPRING_MAIL_* variables.
recovery.mail-from=${RECOVERY_MAIL_FROM:}
recovery.frontend-url=${FRONTEND_URL:http://localhost:4200}
