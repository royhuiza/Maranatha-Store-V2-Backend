services:
  postgres:
    image: postgres:15-alpine
    container_name: maranatha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - maranatha-net

  redis:
    image: redis:7-alpine
    container_name: maranatha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - maranatha-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    container_name: maranatha-auth
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      JWT_SECRET: MaranathaStoreClaveSuperSeguraJWT2026Maranatha
      EUREKA_ENABLED: "false"
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  ms-producto:
    build:
      context: .
      dockerfile: ms-producto/Dockerfile
    container_name: maranatha-productos
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_producto
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      EUREKA_ENABLED: "false"
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  ms-cliente:
    build:
      context: .
      dockerfile: ms-cliente/Dockerfile
    container_name: maranatha-clientes
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_cliente
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      EUREKA_ENABLED: "false"
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  ms-ventas:
    build:
      context: .
      dockerfile: ms-ventas/Dockerfile
    container_name: maranatha-ventas
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_ventas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      PRODUCTO_SERVICE_URL: http://ms-producto:8082
      CLIENTE_SERVICE_URL: http://ms-cliente:8083
      EUREKA_ENABLED: "false"
    ports: ["8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy
      ms-producto:
        condition: service_started
      ms-cliente:
        condition: service_started
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  ms-chat:
    build:
      context: .
      dockerfile: ms-chat/Dockerfile
    container_name: maranatha-chat
    environment:
      SERVER_PORT: 8085
      EUREKA_ENABLED: "false"
      N8N_URL: http://maranatha-n8n:5678/webhook/maranatha-chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8085:8085"]
    depends_on: []
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  maranatha-n8n:
    image: n8nio/n8n:latest
    container_name: maranatha-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=maranatha-n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    networks:
      - maranatha-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: maranatha-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://ms-auth:8081
      PRODUCTO_SERVICE_URL: http://ms-producto:8082
      CLIENTE_SERVICE_URL: http://ms-cliente:8083
      VENTAS_SERVICE_URL: http://ms-ventas:8084
      CHAT_SERVICE_URL: http://ms-chat:8085
      JWT_SECRET: MaranathaStoreClaveSuperSeguraJWT2026Maranatha
      EUREKA_ENABLED: "false"
    ports: ["8080:8080"]
    depends_on:
      - ms-auth
      - ms-producto
      - ms-cliente
      - ms-ventas
      - ms-chat
    networks:
      - maranatha-net
    volumes:
      - ~/.m2:/root/.m2

  maranatha-whatsapp:
    image: evoapicloud/evolution-api:latest
    container_name: maranatha-whatsapp
    restart: always
    ports:
      - "8086:8080"
    environment:
      - SERVER_URL=http://localhost:8086
      - DOCKER_ENV=true
      - API_KEY=maranatha_secret_key_2026
      - AUTHENTICATION_API_KEY=maranatha_secret_key_2026
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:admin123@postgres:5432/postgres?schema=public
      - DATABASE_CLIENT_NAME=evolution_db
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://maranatha-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      - postgres
      - redis

networks:
  maranatha-net:
    driver: bridge

volumes:
  postgres_data:
